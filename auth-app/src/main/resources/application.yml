spring:
  datasource:
    # url, username and password (or password-file) come only from SPRING_DATASOURCE_* variables.
    hikari:
      # cross-cutting.md §8: 10 connections, 5 s to get one, 5 s per statement.
      maximum-pool-size: 10
      connection-timeout: 5000
      connection-init-sql: SET statement_timeout = 5000
      # The service starts and answers /health without the database; a request that needs it
      # fails with a 500 and works again once the database is back.
      initialization-fail-timeout: -1
  sql:
    init:
      # No schema.sql or data.sql: migrations belong to synkro-auth-db and never run at startup.
      mode: never

synkro:
  auth:
    login-max-concurrent: ${AUTH_LOGIN_MAX_CONCURRENT:2}
    login-overload-retry-seconds: ${AUTH_LOGIN_OVERLOAD_RETRY_SECONDS:1}
    login-failure-threshold: ${AUTH_LOGIN_FAILURE_THRESHOLD:3}
    login-window-seconds: ${AUTH_LOGIN_WINDOW_SECONDS:60}
    login-initial-cooldown-seconds: ${AUTH_LOGIN_INITIAL_COOLDOWN_SECONDS:30}
    login-max-cooldown-seconds: ${AUTH_LOGIN_MAX_COOLDOWN_SECONDS:120}
    login-retention-seconds: ${AUTH_LOGIN_RETENTION_SECONDS:600}
    login-max-accounts: ${AUTH_LOGIN_MAX_ACCOUNTS:10000}
    login-cleanup-ms: ${AUTH_LOGIN_CLEANUP_MS:30000}
